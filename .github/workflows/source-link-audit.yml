name: Source link audit

on:
  schedule:
    - cron: "17 19 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Verify research sources
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Check catalog source links
        run: npm run links:check
