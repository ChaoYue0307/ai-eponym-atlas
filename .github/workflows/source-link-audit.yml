name: Source link audit

on:
  schedule:
    - cron: "17 19 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Verify research sources
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_LINK_MAX_WARNING_RATIO: "0.50"
      SOURCE_LINK_REPORT: source-link-audit-report.json

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Check atlas source links
        run: npm run links:check

      - name: Upload source audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-link-audit-report
          path: source-link-audit-report.json
          if-no-files-found: error
          retention-days: 30
